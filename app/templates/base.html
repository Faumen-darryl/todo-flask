<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tâches de travail{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', filename='fonts/barlow-latin-400-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ url_for('tasks.index') }}">
        <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="24" fill="currentColor"/>
          <path d="M14 25l7 7 13-15" fill="none" stroke="#fff" stroke-width="5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand__text">
          <span class="brand__name">To-do</span>
          <span class="brand__tagline">Tâches de travail</span>
        </span>
      </a>
      <p class="site-header__date" id="today">{{ today_paris() }}</p>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      {% if config.STATIC_SITE %}
      <p>Version en ligne · les tâches restent dans votre navigateur</p>
      {% else %}
      <p>Application locale · les tâches restent sur cet ordinateur</p>
      {% endif %}
    </div>
  </footer>
  {% if config.STATIC_SITE %}
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% endif %}
</body>
</html>

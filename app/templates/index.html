{% extends "base.html" %}

{#- Une seule définition des cartes : utilisée par Flask (rendu serveur) et,
    dans le site figé, par les <template> que remplit static/js/app.js. -#}

{% macro todo_card(task=None) -%}
<li class="card task">
  <div class="task__body">
    <span class="task-title">{{ task.title if task }}</span>
    <span class="task__meta">
      Ajoutée le <time class="js-created" datetime="{{ task.created_at if task }}">{{ (task.created_at if task)|paris }}</time>
    </span>
  </div>
  <form method="post"
        {%- if task %} action="{{ url_for('tasks.complete_task', task_id=task.id) }}"{% endif %}>
    <button type="submit" class="btn btn--outline btn--check"
            {%- if task %} aria-label="Valider « {{ task.title }} »"{% endif %}>Valider</button>
  </form>
</li>
{%- endmacro %}

{% macro done_card(task=None) -%}
<li class="card task task--done">
  <svg class="task__check" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
    <circle cx="14" cy="14" r="13.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8.5 14.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </svg>
  <div class="task__body">
    <span class="task-title">{{ task.title if task }}</span>
    <span class="task__meta">
      Ajoutée le <time class="js-created" datetime="{{ task.created_at if task }}">{{ (task.created_at if task)|paris }}</time>
      · terminée le <time class="js-completed" datetime="{{ task.completed_at if task }}">{{ (task.completed_at if task)|paris }}</time>
    </span>
  </div>
</li>
{%- endmacro %}

{% block title %}Tâches de travail ({{ stats.pct }} %){% endblock %}

{% block content %}
<section class="band band--peach" aria-labelledby="todo-heading">
  <div class="wrap">
    <p class="eyebrow">Suivi du travail.</p>
    <h1>Mes tâches</h1>

    <div class="card panel">
      <p class="progress-text" id="progress-text">
        <strong>{{ stats.done }} / {{ stats.total }}</strong>
        terminée{{ 's' if stats.done > 1 }} ({{ stats.pct }}&nbsp;%)
      </p>
      <div class="progress" id="progress" role="progressbar" aria-label="Progression"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ stats.pct }}">
        <div class="progress__bar" id="progress-bar" style="width: {{ stats.pct }}%"></div>
      </div>

      <form class="add-form" id="add-form" method="post"
            {%- if not config.STATIC_SITE %} action="{{ url_for('tasks.create_task') }}"{% endif %}>
        <label for="title" class="visually-hidden">Nouvelle tâche</label>
        <input id="title" name="title" type="text" placeholder="Nouvelle tâche…"
               maxlength="{{ max_title_length }}" required autofocus autocomplete="off">
        <button type="submit" class="btn btn--filled btn--chevron">Ajouter</button>
      </form>

      <div id="flash-zone">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
          <p class="flash flash--{{ category }}" role="alert">{{ message }}</p>
          {% endfor %}
        {% endwith %}
        {% if config.STATIC_SITE %}
        <noscript>
          <p class="flash flash--error">Cette page a besoin de JavaScript pour enregistrer vos tâches.</p>
        </noscript>
        {% endif %}
      </div>
    </div>

    <div class="section-head">
      <h2 id="todo-heading">À faire</h2>
      <span class="count" id="todo-count">{{ todo|length }}</span>
    </div>
    <ol class="task-list" id="todo-list">
      {% for task in todo %}
      {{ todo_card(task) }}
      {% endfor %}
    </ol>
    <p class="card empty" id="todo-empty" {%- if todo %} hidden{% endif %}>Rien à faire pour l'instant.</p>
  </div>
</section>

<section class="band band--grey" aria-labelledby="done-heading">
  <div class="wrap">
    <p class="eyebrow">Historique.</p>
    <div class="section-head">
      <h2 id="done-heading">Terminées</h2>
      <span class="count" id="done-count">{{ done|length }}</span>
    </div>
    <ol class="task-list" id="done-list">
      {% for task in done %}
      {{ done_card(task) }}
      {% endfor %}
    </ol>
    <p class="card empty" id="done-empty" {%- if done %} hidden{% endif %}>Aucune tâche terminée pour l'instant.</p>

    {% if config.STATIC_SITE %}
    <div class="card backup">
      <div class="backup__text">
        <p class="backup__title">Sauvegarde</p>
        <p>Vos tâches sont enregistrées dans ce navigateur, sur cet ordinateur. Exportez-les de temps en temps : le fichier permet de les restaurer ou de les retrouver sur un autre poste.</p>
      </div>
      <div class="backup__actions">
        <button type="button" class="btn btn--outline" id="export">Exporter</button>
        <input type="file" id="import-file" accept="application/json,.json" class="visually-hidden">
        <label class="btn btn--outline" for="import-file">Importer</label>
      </div>
    </div>

    <template id="tpl-todo">{{ todo_card() }}</template>
    <template id="tpl-done">{{ done_card() }}</template>
    {% endif %}
  </div>
</section>
{% endblock %}
